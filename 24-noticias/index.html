<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>24 NOTÍCIAS™ — DIRETO</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,700;0,900;1,700&family=Inter:wght@500;700;800;900&display=swap');

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050505;
    color: #ffffff;
    font-family: 'Inter', Arial, Helvetica, sans-serif;
  }

  .screen {
    width: 1920px;
    height: 1080px;
    position: absolute;
    left: 0;
    top: 0;
    transform-origin: top left;
    overflow: hidden;
    background: #0a0a0a;
  }

  .hero {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 40% 40%, #1c1c1c, #080808 80%);
    overflow: hidden;
  }

  .hero .img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
    animation: slowZoom 22s ease-in-out infinite alternate;
  }

  @keyframes slowZoom {
    from { transform: scale(1); }
    to { transform: scale(1.06); }
  }

  .topbar {
    position: absolute;
    top: 40px;
    left: 48px;
    display: flex;
    align-items: stretch;
    box-shadow: 0 8px 25px rgba(0,0,0,0.65);
    z-index: 5;
  }

  .cnn-logo {
    background: #CC0000;
    color: #ffffff;
    font-family: 'Roboto Condensed', Arial, sans-serif;
    font-size: 58px;
    font-weight: 900;
    letter-spacing: -3px;
    padding: 4px 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 0.95;
  }

  .live-badge {
    background: #ffffff;
    color: #0b0b0b;
    font-family: 'Roboto Condensed', Arial, sans-serif;
    font-size: 25px;
    font-weight: 900;
    padding: 0 18px;
    display: flex;
    align-items: center;
    gap: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .live-dot {
    width: 12px;
    height: 12px;
    background: #CC0000;
    border-radius: 50%;
    animation: pulse 1.3s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.3; transform: scale(0.8); }
  }

  .status {
    position: absolute;
    right: 48px;
    top: 40px;
    background: rgba(12, 12, 12, 0.9);
    color: #e0e0e0;
    padding: 10px 16px;
    font-family: 'Roboto Condensed', Arial, sans-serif;
    font-size: 15px;
    font-weight: 700;
    z-index: 10;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .status.ok { color: #b8f2c2; }
  .status.err { color: #ff8a8a; }

  .sidebar {
    position: absolute;
    right: 48px;
    top: 112px;
    width: 430px;
    background: rgba(12, 12, 12, 0.92);
    backdrop-filter: blur(8px);
    padding: 20px 22px;
    box-shadow: 0 14px 40px rgba(0,0,0,0.75);
    z-index: 4;
  }

  .sidehead {
    font-family: 'Roboto Condensed', Arial, sans-serif;
    font-size: 22px;
    font-weight: 900;
    color: #ffffff;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .sidehead span {
    background: #CC0000;
    font-size: 13px;
    padding: 3px 8px;
    letter-spacing: 1px;
  }

  .sideitem {
    padding: 12px 0;
  }
  .sideitem:last-child { padding-bottom: 4px; }

  .sidecat {
    font-family: 'Roboto Condensed', Arial, sans-serif;
    font-size: 14px;
    color: #CC0000;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .sidetitle {
    font-family: 'Roboto Condensed', Arial, sans-serif;
    font-size: 20px;
    line-height: 1.2;
    font-weight: 700;
    color: #f4f4f4;
    margin-top: 4px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* =========================================
     LOWER THIRD CLÁSSICO CNN (LARGURA TOTAL)
     ========================================= */
  .lower {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 54px;
    z-index: 6;
    display: flex;
    flex-direction: column;
  }

  .lower-top-row {
    display: flex;
    align-items: stretch;
    padding-left: 170px;
  }

  .breaking-tag {
    background: #CC0000;
    color: #ffffff;
    font-family: 'Roboto Condensed', Arial, sans-serif;
    font-size: 24px;
    font-weight: 900;
    padding: 6px 22px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    display: flex;
    align-items: center;
  }

  .cat-tag {
    background: #0d0d0d;
    color: #ffffff;
    font-family: 'Roboto Condensed', Arial, sans-serif;
    font-size: 22px;
    font-weight: 700;
    padding: 6px 20px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    display: flex;
    align-items: center;
  }

  .lower-main {
    display: flex;
    align-items: stretch;
    background: #ffffff;
    min-height: 118px;
  }

  .cnn-lower-box {
    width: 170px;
    background: #CC0000;
    color: #ffffff;
    font-family: 'Roboto Condensed', Arial, sans-serif;
    font-size: 62px;
    font-weight: 900;
    letter-spacing: -3px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    line-height: 0.9;
    flex-shrink: 0;
  }

  .cnn-lower-sub {
    font-size: 14px;
    font-weight: 900;
    letter-spacing: 2px;
    margin-top: 4px;
    text-transform: uppercase;
  }

  .lower-texts {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    overflow: hidden;
  }

  .headline {
    background: #ffffff;
    color: #0b0b0b;
    font-family: 'Roboto Condensed', Arial, sans-serif;
    font-size: 56px;
    font-weight: 900;
    line-height: 1.05;
    padding: 12px 28px 8px 28px;
    text-transform: uppercase;
    letter-spacing: -0.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .sub-bar {
    background: #f2f2f2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 28px;
    gap: 24px;
  }

  .summary {
    font-family: 'Roboto Condensed', Arial, sans-serif;
    font-size: 23px;
    font-weight: 700;
    color: #222222;
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
    text-transform: uppercase;
  }

  .source {
    font-family: 'Roboto Condensed', Arial, sans-serif;
    font-size: 19px;
    font-weight: 900;
    color: #CC0000;
    text-transform: uppercase;
    letter-spacing: 1px;
    white-space: nowrap;
  }

  .ticker {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 54px;
    background: #0a0a0a;
    display: flex;
    align-items: center;
    z-index: 8;
  }

  .ticker-clock {
    width: 170px;
    height: 100%;
    background: #1a1a1a;
    color: #ffffff;
    font-family: 'Roboto Condensed', Arial, sans-serif;
    font-weight: 900;
    font-size: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .ticker-brand {
    height: 100%;
    background: #CC0000;
    color: #ffffff;
    font-family: 'Roboto Condensed', Arial, sans-serif;
    font-weight: 900;
    font-size: 22px;
    padding: 0 22px;
    display: flex;
    align-items: center;
    letter-spacing: 1px;
    white-space: nowrap;
  }

  .tickerbody {
    overflow: hidden;
    white-space: nowrap;
    flex: 1;
    font-family: 'Roboto Condensed', Arial, sans-serif;
    font-size: 23px;
    font-weight: 700;
    color: #ffffff;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .tickertext {
    display: inline-block;
    padding-left: 100%;
    animation: move 60s linear infinite;
  }

  @keyframes move {
    to { transform: translateX(-100%); }
  }
  /* LIVE 19.0: ajustar textos sem alterar dimensões */
  .headline, .summary, .sidetitle { text-overflow: clip; }
</style>
</head>
<body>
<main class="screen">
  <section class="hero">
    <img class="img" id="heroImg" referrerpolicy="no-referrer" alt="">
  </section>

  <header class="topbar">
    <div class="cnn-logo">24N</div>
    <div class="live-badge"><span class="live-dot"></span>DIRETO</div>
  </header>

  <div class="status" id="status">A ligar à redação…</div>

  <aside class="sidebar">
    <div class="sidehead">ÚLTIMAS NOTÍCIAS <span>AO MINUTO</span></div>
    <div id="other"></div>
  </aside>

  <section class="lower">
    <div class="lower-top-row">
      <div class="breaking-tag">ÚLTIMA HORA</div>
      <div class="cat-tag" id="category">ATUALIDADE</div>
    </div>
    <div class="lower-main">
      <div class="cnn-lower-box">
        <span>24N</span>
        <span class="cnn-lower-sub">DIRETO</span>
      </div>
      <div class="lower-texts">
        <div class="headline" id="headline">A CARREGAR NOTÍCIAS EM DIRETO…</div>
        <div class="sub-bar">
          <div class="summary" id="summary">A recolher os principais destaques dos órgãos de comunicação social.</div>
          <div class="source" id="source">REDAÇÃO 24N</div>
        </div>
      </div>
    </div>
  </section>

  <footer class="ticker">
    <div class="ticker-clock" id="clock">--:--:--</div>
    <div class="ticker-brand">ÚLTIMAS</div>
    <div class="tickerbody">
      <span class="tickertext" id="ticker">A CARREGAR ÚLTIMAS NOTÍCIAS…</span>
    </div>
  </footer>
</main>

<script>
/* 24 NOTÍCIAS™ | Emissão em direto */
const $ = id => document.getElementById(id);
const MAX_AGE_MS = 48 * 60 * 60 * 1000;
const REFRESH_MS = 60 * 1000;
const ROTATION_MS = 18 * 1000;
let news = [], idx = 0, last = '', busy = false, seq = 0;

const FEEDS = [
  { url: 'https://www.publico.pt/rss',            source: 'Público',            category: 'Portugal' },
  { url: 'https://expresso.pt/rss',               source: 'Expresso',           category: 'Portugal' },
  { url: 'https://www.dn.pt/rss',                 source: 'Diário de Notícias', category: 'Portugal' },
  { url: 'https://www.jn.pt/rss',                 source: 'Jornal de Notícias', category: 'Portugal' },
  { url: 'https://www.noticiasaominuto.com/rss/ultima-hora', source: 'Notícias ao Minuto', category: 'Portugal' },
  { url: 'https://cnnportugal.iol.pt/rss.xml',    source: 'CNN Portugal',       category: 'Portugal' },
  { url: 'https://rss.impresa.pt/feed/latest/sicnot.rss?type=ARTICLE,VIDEO,GALLERY,STREAM,PLAYLIST,EVENT,NEWSLETTER&limit=20&pubsubhub=true', source: 'SIC Notícias', category: 'Portugal' },
  { url: 'https://www.cmjornal.pt/rss',           source: 'Correio da Manhã (CMTV)', category: 'Portugal' },
  { url: 'https://feeds.bbci.co.uk/news/world/rss.xml', source: 'BBC World', category: 'Mundo' },
  { url: 'https://pt.euronews.com/rss',           source: 'Euronews',           category: 'Mundo' },
  { url: 'https://news.google.com/rss/search?q=world&hl=pt-PT&gl=PT&ceid=PT:pt', source: 'Google News', category: 'Mundo' }
];

const PROXY_CORSDEV    = 'https://proxy.cors.dev/';
const PROXY_ALLORIGINS = 'https://api.allorigins.win/raw?url=';

function fit() {
  const scale = Math.min(innerWidth / 1920, innerHeight / 1080);
  const e = document.querySelector('.screen');
  e.style.transform = 'scale(' + scale + ')';
  e.style.left = (innerWidth - 1920 * scale) / 2 + 'px';
  e.style.top = (innerHeight - 1080 * scale) / 2 + 'px';
}
addEventListener('resize', fit);
fit();

function clock() {
  $('clock').textContent = new Intl.DateTimeFormat('pt-PT', { timeZone: 'Europe/Lisbon', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }).format(new Date());
}
clock();
setInterval(clock, 1000);

function status(t, k = '') {
  const e = $('status');
  e.textContent = t;
  e.className = 'status' + (k ? ' ' + k : '');
}

function fitText(el, max, min, lines) {
  el.style.fontSize = max + 'px';
  el.style.whiteSpace = 'nowrap';
  el.style.overflow = 'hidden';
  el.style.textOverflow = 'clip';
  el.style.display = 'block';
  el.style.webkitLineClamp = '';
  for (let px = max; px >= min; px--) {
    el.style.fontSize = px + 'px';
    if (el.scrollWidth <= el.clientWidth + 1) return;
  }
  if (lines > 1) {
    el.style.fontSize = min + 'px';
    el.style.whiteSpace = 'normal';
    el.style.display = '-webkit-box';
    el.style.webkitBoxOrient = 'vertical';
    el.style.webkitLineClamp = String(lines);
  }
}

function adjust() {
  fitText($('headline'), 56, 26, 2);
  fitText($('summary'), 23, 16, 1);
  document.querySelectorAll('.sidetitle').forEach(e => fitText(e, 20, 15, 2));
}
addEventListener('resize', adjust);
if (document.fonts?.ready) document.fonts.ready.then(adjust);

function stripHtml(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.innerHTML = s;
  return (d.textContent || d.innerText || '').replace(/\s+/g, ' ').trim();
}
function truncar(s, n) {
  if (!s) return '';
  if (s.length <= n) return s;
  const c = s.slice(0, n);
  const u = c.lastIndexOf(' ');
  return (u > 40 ? c.slice(0, u) : c) + '…';
}
function safeImage(u) {
  if (!u) return '';
  let url = String(u).trim();
  if (url.startsWith('//')) url = 'https:' + url;
  if (url.startsWith('http://')) url = 'https://' + url.slice(7);
  return /^https:\/\//i.test(url) ? url : '';
}
function parseDate(s) {
  if (!s) return new Date();
  let iso = String(s).trim();
  if (/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$/.test(iso)) {
    iso = iso.replace(' ', 'T') + 'Z';
  }
  const d = new Date(iso);
  return isNaN(d.getTime()) ? new Date() : d;
}
function getDynamicFallbackImage(category) {
  const cat = (category || '').toLowerCase();
  let kw = 'news,press';
  if (cat.includes('portugal')) kw = 'lisbon,portugal';
  else if (cat.includes('mundo') || cat.includes('internacional')) kw = 'globe,world';
  else if (cat.includes('economia')) kw = 'finance,business';
  else if (cat.includes('desporto')) kw = 'sports,stadium';
  
  return 'https://loremflickr.com/1920/1080/' + kw + '?lock=' + Math.floor(Math.random() * 9999);
}

function normalizar(item, feed) {
  const titulo = stripHtml(item.title || '');
  const descricao = stripHtml(item.description || item.content || item.summary || '');
  const data = parseDate(item.pubDate || item.published || item.date || item.updated);
  
  let img = safeImage(item.thumbnail);
  if (!img && item.description) {
    const m = item.description.match(/<img[^>]+src=["']([^"']+)["']/i);
    if (m) img = safeImage(m[1]);
  }

  return {
    id: Math.random().toString(36).substr(2, 9),
    title: titulo,
    summary: truncar(descricao, 260) || 'Consulte a fonte original para mais detalhes.',
    source: feed.source,
    published_at: data.toISOString(),
    image_url: img,
    category: feed.category || 'Mundo',
    editorial_status: 'revisto_manualmente',
    image_credit: feed.source,
    link: item.link || ''
  };
}

function valid(n, now) {
  if (!n || n.editorial_status !== 'revisto_manualmente') return false;
  if (!['title', 'summary', 'source', 'published_at'].every(k => typeof n[k] === 'string' && n[k].trim())) return false;
  if (typeof n.image_url !== 'string' || !n.image_url.trim()) return false;
  
  const pub = Date.parse(n.published_at);
  return Number.isFinite(pub) && pub <= now + 300000 && now - pub < MAX_AGE_MS;
}

async function fetchFeed(feed) {
  async function processarXML(xmlText) {
    const doc = new DOMParser().parseFromString(xmlText, 'application/xml');
    const items = Array.from(doc.querySelectorAll('item, entry'));
    
    return items.map(it => {
      const get = sel => (it.querySelector(sel) || {}).textContent || '';
      const linkEl = it.querySelector('link');
      const link = linkEl ? (linkEl.getAttribute('href') || linkEl.textContent) : '';
      const title = get('title');
      
      const enc = it.getElementsByTagName('enclosure')[0];
      const isAudioVideo = enc && (enc.getAttribute('type') || '').match(/^(audio|video)\//i);
      const isMediaLink = /radio|podcast|\/audio\/|\/video\/|tsf|renascenca|antena/i.test(link);
      const isMediaTitle = /podcast|episódio|episodio|ouvir|áudio|audio|vídeo|video|rádio|radio|tsf|renascença|antena|emissão/i.test(title);

      if (isAudioVideo || isMediaLink || isMediaTitle) {
        return null; 
      }
      
      let imgUrl = null;
      const mediaTags = it.getElementsByTagName('media:content');
      for (let m of mediaTags) {
        if (m.getAttribute('url') && (!m.getAttribute('type') || m.getAttribute('type').startsWith('image'))) {
          imgUrl = m.getAttribute('url'); break;
        }
      }
      if (!imgUrl) {
        const thumb = it.getElementsByTagName('media:thumbnail')[0];
        if (thumb) imgUrl = thumb.getAttribute('url');
      }
      if (!imgUrl && enc && enc.getAttribute('type') && enc.getAttribute('type').startsWith('image')) {
        imgUrl = enc.getAttribute('url');
      }
      
      let contentHTML = get('content') || get('encoded') || get('description') || '';
      if (!imgUrl && contentHTML) {
        const match = contentHTML.match(/<img[^>]+src=["']([^"']+)["']/i);
        if (match) imgUrl = match[1];
      }
      
      if (imgUrl) {
        const txt = document.createElement('textarea');
        txt.innerHTML = imgUrl;
        imgUrl = txt.value;
      }

      return normalizar({
        title: title,
        description: contentHTML, 
        pubDate: get('pubDate') || get('published') || get('updated'),
        link: link,
        thumbnail: imgUrl
      }, feed);
    }).filter(item => item !== null);
  }

  try {
    const r = await fetch(PROXY_CORSDEV + feed.url, { cache: 'no-store' });
    if (r.ok) {
      const result = await processarXML(await r.text());
      if (result.length) return result;
    }
  } catch (_) {}

  try {
    const r = await fetch(PROXY_ALLORIGINS + encodeURIComponent(feed.url), { cache: 'no-store' });
    if (r.ok) {
      const result = await processarXML(await r.text());
      if (result.length) return result;
    }
  } catch (_) {}

  return [];
}

function waiting(msg = 'A AGUARDAR REVISÃO EDITORIAL') {
  seq++;
  $('headline').textContent = 'A AGUARDAR NOTÍCIAS VERIFICADAS';
  $('summary').textContent = 'A redação prepara conteúdos para emissão.';
  $('source').textContent = 'REDAÇÃO 24N';
  $('category').textContent = 'REDAÇÃO';
  $('other').replaceChildren();
  $('heroImg').style.display = 'none';
  $('heroImg').removeAttribute('src');
  $('ticker').textContent = '24 NOTÍCIAS • A AGUARDAR CONTEÚDOS VERIFICADOS •';
  status(msg);
  adjust();
}

function render() {
  if (!news.length) { waiting(); return; }
  const n = news[idx % news.length];
  const current = ++seq;
  
  $('category').textContent = (n.category || 'ATUALIDADE').toUpperCase();
  $('headline').textContent = n.title;
  $('summary').textContent = n.summary;
  $('source').textContent = n.source + ' • ' + new Date(n.published_at).toLocaleTimeString('pt-PT', { timeZone: 'Europe/Lisbon', hour: '2-digit', minute: '2-digit' });
  
  const img = $('heroImg');
  let imageURL = safeImage(n.image_url);
  
  if (!imageURL) {
    imageURL = getDynamicFallbackImage(n.category);
  }
  
  if (imageURL) {
    img.onload = () => { if (current === seq) img.style.display = 'block'; };
    img.onerror = () => {
      if (current !== seq) return;
      if (!img.dataset.fallbackTried) {
        img.dataset.fallbackTried = "true";
        img.src = 'https://images.weserv.nl/?url=' + encodeURIComponent(imageURL.replace(/^https?:\/\//, ''));
      } else {
        img.style.display = 'none';
      }
    };
    img.dataset.fallbackTried = "";
    img.src = imageURL;
    img.style.display = 'none';
  } else {
    img.onload = null;
    img.onerror = null;
    img.style.display = 'none';
    img.removeAttribute('src');
  }

  $('other').replaceChildren();
  for (const x of news.filter(x => x !== n).slice(0, 4)) {
    const box = document.createElement('div');
    const cat = document.createElement('div');
    const title = document.createElement('div');
    box.className = 'sideitem';
    cat.className = 'sidecat';
    title.className = 'sidetitle';
    cat.textContent = (x.category || 'ATUALIDADE') + ' • ' + x.source;
    title.textContent = x.title;
    box.append(cat, title);
    $('other').append(box);
  }
  
  const ticker = $('ticker');
  ticker.textContent = news.slice(0, 15).map(x => '▪ ' + (x.category || 'NOTÍCIAS') + ': ' + x.title).join('     ');
  ticker.style.animation = 'none';
  void ticker.offsetWidth;
  ticker.style.animation = 'move ' + Math.max(20, ticker.scrollWidth / 80) + 's linear infinite';
  adjust();
}

async function refresh() {
  if (busy) return;
  busy = true;
  try {
    const resultados = await Promise.allSettled(FEEDS.map(f => fetchFeed(f)));
    const todas = [];
    for (const r of resultados) {
      if (r.status === 'fulfilled' && Array.isArray(r.value)) todas.push(...r.value);
    }

    if (!todas.length) throw Error('Sem notícias');

    const now = Date.now();
    const selected = todas
      .filter(n => valid(n, now))
      .sort((a, b) => Date.parse(b.published_at) - Date.parse(a.published_at));

    const key = JSON.stringify(selected.map(n => [n.id, n.title, n.summary, n.published_at, n.image_url]));
    
    if (key !== last) {
      news = selected;
      idx = 0;
      last = key;
      render();
    } else if (!news.length) {
      waiting();
    }
    
    status(news.length ? 'REDAÇÃO VERIFICADA • ' + news.length + ' NOTÍCIAS' : 'A AGUARDAR REVISÃO EDITORIAL', news.length ? 'ok' : '');
  } catch (e) {
    if (!news.length) waiting('FEED INDISPONÍVEL');
    else status('FEED TEMPORARIAMENTE INDISPONÍVEL', 'err');
    console.warn('24N feed:', e);
  } finally {
    busy = false;
  }
}

waiting();
refresh();
setInterval(refresh, REFRESH_MS);
setInterval(() => { if (news.length > 1) { idx = (idx + 1) % news.length; render(); } }, ROTATION_MS);
</script>

<!-- 24N AUTO BREAK™ | overlay independente do grafismo noticioso -->
<iframe id="autoBreak" title="24N SHOP — intervalo comercial" src="./intervalo.html" allow="autoplay" style="position:fixed;inset:0;width:100vw;height:100vh;border:0;display:none;z-index:99999;background:#090909" aria-hidden="true"></iframe>
<script>
(() => {
  const NEWS_MS=15*60*1000, AD_MS=2*60*1000;
  const frame=document.getElementById('autoBreak');
  let active=false,started=Date.now(),lastBreak=Date.now(),timeout=null;
  function finish(){
    if(!active)return;
    active=false;frame.style.display='none';frame.setAttribute('aria-hidden','true');
    lastBreak=Date.now();clearTimeout(timeout);
  }
  function start(){
    if(active)return;
    active=true;started=Date.now();frame.style.display='block';frame.setAttribute('aria-hidden','false');
    const send=()=>frame.contentWindow?.postMessage({type:'24n-break-start',duration:AD_MS},location.origin);
    if(frame.contentDocument?.readyState==='complete')send();
    else frame.addEventListener('load',send,{once:true});
    timeout=setTimeout(finish,AD_MS+2000);
  }
  window.addEventListener('message',e=>{
    if(e.origin===location.origin&&e.source===frame.contentWindow&&e.data?.type==='24n-break-finished')finish();
  });
  // Atalhos do operador: I inicia intervalo; Escape termina.
  window.addEventListener('keydown',e=>{
    if(e.altKey||e.ctrlKey||e.metaKey||e.repeat)return;
    if(e.key.toLowerCase()==='i')start();
    if(e.key==='Escape')finish();
  });
  // Permite abrir a cena no OBS com ?intervalo=agora para testes manuais.
  const params=new URLSearchParams(location.search);
  if(params.get('intervalo')==='agora')setTimeout(start,1200);
  // O intervalo conta desde o último regresso às notícias.
  setInterval(()=>{if(!active&&Date.now()-lastBreak>=NEWS_MS)start();},1000);
  // Comandos opcionais para operador OBS, na consola do navegador.
  window.N24AutoBreak={start,finish,get active(){return active;}};
})();
</script>
